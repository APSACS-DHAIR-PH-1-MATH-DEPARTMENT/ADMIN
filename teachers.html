<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <title>Teachers — Staff Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="app-side" aria-label="Menu"></aside>
  <div class="shell__body">
    <header class="topbar" id="app-header"></header>
    <main class="wrap wrap--app wrap--wide">
      <div id="page-msg" role="alert" hidden></div>
      <div class="card">
        <h2>Add a teacher</h2>
        <p class="muted small">We email them a link to set their own password. They will only see the classes and sections you tick — for example 7A, 8B and 8C.</p>
        <label for="t-name">Full name</label>
        <input class="input" id="t-name" autocomplete="off" maxlength="80">
        <label for="t-email">Email</label>
        <input class="input" id="t-email" type="email" autocomplete="off" autocapitalize="none" maxlength="120">
        <div class="label">Classes and sections</div>
        <div id="t-classes"></div>
        <button class="btn" id="t-add" type="button">Add teacher and send the email</button>
      </div>
      <div class="card">
        <h2>Staff</h2>
        <div id="flash" role="status" hidden></div>
        <div id="t-list" class="list"></div>
      </div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/datetime.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/teachers.js"></script>
</body>
</html>
