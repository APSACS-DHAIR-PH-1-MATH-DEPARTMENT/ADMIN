<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <title>Students — Staff Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="app-side" aria-label="Menu"></aside>
  <div class="shell__body">
    <header class="topbar" id="app-header"></header>
    <main class="wrap wrap--app wrap--wide">
      <div id="page-msg" role="alert" hidden></div>
      <div class="card">
        <h2>Students</h2>
        <div class="filters">
          <div><label for="f-q">Search</label><input class="input" id="f-q" type="search" placeholder="Name, father, ID or email" autocomplete="off"></div>
          <div><label for="f-status">Status</label><select class="input" id="f-status"><option value="">All</option><option value="pending">Waiting for approval</option><option value="active">Active</option><option value="suspended">Suspended</option></select></div>
          <div><label for="f-class">Class</label><select class="input" id="f-class"><option value="">All</option></select></div>
          <div><label for="f-section">Section</label><select class="input" id="f-section"><option value="">All</option></select></div>
        </div>
        <p class="small muted" id="count"></p>
        <div id="flash" role="status" hidden></div>
        <div id="list" class="list"></div>
      </div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/datetime.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/student-cards.js"></script>
<script src="assets/js/students.js"></script>
</body>
</html>
