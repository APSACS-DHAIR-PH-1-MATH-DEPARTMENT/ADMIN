<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <title>Class — Staff Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<div class="shell">
  <aside class="side" id="app-side" aria-label="Menu"></aside>
  <div class="shell__body">
    <header class="topbar" id="app-header"></header>
    <main class="wrap wrap--app wrap--wide">
      <div id="page-msg" role="alert" hidden></div>
      <div class="card">
        <p class="small"><a href="classes.html">← All classes</a></p>
        <h1 id="class-title">Class</h1>
        <p class="muted small" id="class-sub"></p>
        <div class="actions"><a class="btn btn--small" id="go-copy" href="remarks.html">Copy check for this class</a><a class="btn btn--small btn--ghost" id="go-over" href="overview.html">Class overview</a></div>
        <label for="c-q">Search this class</label>
        <input class="input" id="c-q" type="search" placeholder="Name, father or Student ID" autocomplete="off">
      </div>
      <div id="flash" role="status" hidden></div>
      <div id="student-list" class="list"></div>
      <p class="muted" id="class-empty" hidden>No students in this class yet.</p>
    </main>
  </div>
</div>
<div class="scrim" id="scrim" hidden></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/datetime.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/class.js"></script>
</body>
</html>
