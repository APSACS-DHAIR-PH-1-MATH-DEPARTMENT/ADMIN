<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#14532d">
  <title>Administrator login — Staff Portal</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
  <link rel="icon" href="assets/img/favicon.ico">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
<main class="wrap wrap--auth">
  <div class="hero">
    <img class="hero__logo" src="assets/img/logo-512.webp" width="132" height="132" alt="APSACS DHA-I R Phase 1 Mathematics Department logo">
    <h1 class="hero__title">Administrator</h1>
    <p class="hero__dept">APSACS DHA-I R Phase 1 Mathematics Department</p>
  </div>

  <div class="card">

    <div id="page-msg" role="status" aria-live="polite" hidden></div>

    <section id="panel-admin">
            <p class="muted small">Log in with your email and the administrator password.</p>
      <form id="admin-form" novalidate>
        <label for="a-email">Email</label>
        <input class="input" id="a-email" name="username" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="120">
        <label for="a-pass">Password</label>
        <div class="field-row">
          <input class="input" id="a-pass" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" maxlength="200">
          <button class="toggle" type="button" data-toggle-pin="a-pass" aria-pressed="false">Show</button>
        </div>
        <button class="btn" id="a-btn" type="submit">Log in as administrator</button>
      </form>
      <div id="admin-msg" role="alert" hidden></div>
    </section>
  </div>

  <p class="footer">© APSACS DHA-I R Phase 1 Mathematics Department</p>
  <noscript><div class="notice notice--bad">Please turn on JavaScript to use this site.</div></noscript>
</main>
<script src="assets/js/config.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/login.js"></script>
</body>
</html>
